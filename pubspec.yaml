name: shadowcv
description: "ShadowCV - Professional CV Analysis"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: 4.6.0
  firebase_auth: 6.2.0
  cloud_firestore: 6.2.0
  firebase_storage: 13.1.0

  # Auth
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.5

  # Storage / Prefs
  shared_preferences: ^2.5.4

  # NEU: PDF auswählen & lesen
  file_picker: ^8.1.2
  syncfusion_flutter_pdf: ^27.1.48   # PDF Text-Extraktion (on-device, kostenlos)

  pdf: ^3.10.8
  printing: ^5.12.0

  # NEU: HTTP für Claude API
  http: ^1.6.0

  # Voice Interaction
  flutter_tts: ^4.2.2
  speech_to_text: ^7.1.0

  # NEU: UUID für eindeutige IDs
  uuid: ^4.4.2

  # Push Notifications
  firebase_messaging: 16.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  permission_handler: ^11.3.1

  in_app_purchase: ^3.1.13
  image: ^4.8.0
  image_picker: ^1.2.1
  crop_your_image: ^1.1.0
  flutter_riverpod: ^3.3.1
  before_after: ^3.2.0
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Boldo
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/static/SpaceGrotesk-Bold.ttf
          weight: 700
  assets:
    - assets/images/ShadowCV-Logo.png
    - assets/images/google1.png
    - assets/images/facebook.png
    - assets/images/NewLogo.png